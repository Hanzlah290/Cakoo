>

    <defs>

        <linearGradient id="chocolateGradient" x1="0" y1="0" x2="0" y2="1">

            <stop offset="0%" stop-color="#5B3624"/>
            <stop offset="18%" stop-color="#4A2C1E"/>
            <stop offset="45%" stop-color="#3A2116"/>
            <stop offset="72%" stop-color="#2A170F"/>
